# Runs on every push and pull request: lint, typecheck, tests (Google APIs are mocked), build.
# Deployment itself is done by Cloudflare Workers Builds (connected to this repo in the Cloudflare dashboard).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          set +e
          # npm install (not npm ci): the lockfile is created on Windows and misses two optional
          # WebAssembly helper packages that npm on Linux expects; npm install adds them.
          npm install --no-audit --no-fund > npm-ci.log 2>&1
          status=$?
          if [ $status -ne 0 ]; then
            # Surface the error as annotations (visible on the run summary).
            grep -E "npm (ERR|error)" npm-ci.log | grep -vE "^npm error *$" | head -n 9 | while IFS= read -r line; do echo "::error title=npm install::$line"; done
            exit $status
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
